version: '3.8'
services:
  rag_app:
    build: .
    container_name: rag_app
#    ports:
#     - "8501:8501"
    volumes:
      - ./app:/app/app       
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    labels:
      - traefik.enable=true
      - traefik.http.routers.mediprep.rule=Host(`agentic-rag.aimanhaziq.my`)
      - traefik.http.routers.mediprep.entrypoints=websecure
      - traefik.http.routers.mediprep.tls=true
      - traefik.http.routers.mediprep.tls.certresolver=apacheresolver
      - traefik.http.services.mediprep.loadbalancer.server.port=8501
      # Traefik Basic Auth
      - "traefik.http.middlewares.mediprep-auth.basicauth.users=xxx:xxxxxx"
      - "traefik.http.routers.mediprep.middlewares=mediprep-auth"
    networks:
      - proxy

networks:
  proxy:
    external: true